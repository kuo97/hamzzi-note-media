# 햄찌노트 인스타 클라우드 발행 (2026-10-19) — 노트북이 꺼져 있어도 나간다.
# 주 트리거 = cron-job.org 가 발행 5분 전·20분 뒤에 workflow_dispatch(mode=run) 호출
#   (깃허브 자체 예약은 몇 시간 밀린다). 아래 schedule 은 보조.
# 스크립트가 발행 시각 전이면 기다리고, 이미 올린 건 건너뛰므로 여러 번 돌아도 한 번만 올라간다.
name: hamzzi-publish
on:
  schedule:
    - cron: "25 22 * * *"   # 07:25 KST (전날 UTC)
    - cron: "25 3 * * *"    # 12:25 KST
    - cron: "25 7 * * *"    # 16:25 KST (릴스)
    - cron: "40 10 * * *"   # 19:40 KST
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 큐 발행 / test = 토큰·호스팅만 시험(게시 안 함)"
        default: "test"
      no:
        description: "(선택) 이 번호만 지금 바로 발행"
        default: ""
      name:
        description: "(쓰지 않음 — 피식니혼고 깨우기 작업을 복제해도 거부되지 않게 받아만 둔다)"
        default: ""
permissions:
  contents: write
  pages: write
concurrency:
  group: hamzzi-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python .github/scripts/cloud_publish.py "${{ github.event.inputs.mode || 'run' }}" "${{ github.event.inputs.no }}"
